name: Temporary probe of avoiding unpaved roads
on:
  push:
    branches: [claude/route-planning-google-maps-xxipbl]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Plan with and without exclude_unpaved, and measure the dirt on each
        run: |
          cat > probe.py <<'PY'
          import json, urllib.request
          V = "https://valhalla1.openstreetmap.de"
          def post(path, body):
              req = urllib.request.Request(V + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e: return {"http": e.code, "body": e.read().decode()[:300]}
          trips = [("Imbil-Jimna", (-26.46, 152.68), (-26.66, 152.46)), ("Kenilworth-Conondale", (-26.597, 152.728), (-26.73, 152.72))]
          for name, a, b in trips:
              for opt in [{}, {"exclude_unpaved": True}, {"exclude_unpaved": 1}]:
                  body = {"locations": [{"lat": a[0], "lon": a[1]}, {"lat": b[0], "lon": b[1]}], "costing": "motorcycle",
                          "costing_options": {"motorcycle": {"use_highways": 0, "use_trails": 0, **opt}}}
                  r = post("/route", body)
                  if "trip" not in r: print(name, opt, "ERROR", r); continue
                  shape = r["trip"]["legs"][0]["shape"]
                  t = post("/trace_attributes", {"encoded_polyline": shape, "costing": "motorcycle", "shape_match": "edge_walk",
                          "filters": {"attributes": ["edge.unpaved", "edge.length", "edge.surface"], "action": "include"}})
                  edges = t.get("edges", [])
                  dirt = sum(e.get("length", 0) for e in edges if e.get("unpaved"))
                  surf = sorted({e.get("surface") for e in edges if e.get("unpaved")})
                  print(f"{name} {opt}: {r['trip']['summary']['length']:.1f} km, {r['trip']['summary']['time']/60:.0f} min, unpaved {dirt:.1f} km {surf} {'' if edges else t}")
          PY
          python3 probe.py
