name: Probe loops (temporary)
on:
  push:
    branches: [claude/route-planning-google-maps-xxipbl]
    paths: [probe/**, .github/workflows/probe.yml, src/lib/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run probe/loop.probe.test.ts --reporter=verbose --silent=false
