name: Screen tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The screenshots, to look at (Actions run → Artifacts), pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            e2e/screenshots/
            test-results/
