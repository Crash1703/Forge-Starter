name: Temporary probe of road density along a route
on:
  push:
    branches: [claude/route-planning-google-maps-xxipbl]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Density and road class along Maleny -> Brisbane CBD
        run: |
          cat > probe.py <<'PY'
          import json, urllib.request
          V = "https://valhalla1.openstreetmap.de"
          def post(path, body):
              req = urllib.request.Request(V + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          for name, a, b in [("Maleny-BrisbaneCBD", (-26.76, 152.85), (-27.4705, 153.026)), ("Caloundra-Buderim", (-26.80, 153.13), (-26.685, 153.05))]:
              r = post("/route", {"locations": [{"lat": a[0], "lon": a[1]}, {"lat": b[0], "lon": b[1]}], "costing": "motorcycle", "costing_options": {"motorcycle": {"use_highways": 0, "use_trails": 0}}})
              shape = r["trip"]["legs"][0]["shape"]
              t = post("/trace_attributes", {"encoded_polyline": shape, "costing": "motorcycle", "shape_match": "edge_walk",
                    "filters": {"attributes": ["edge.density", "edge.road_class", "edge.use", "edge.length", "edge.names", "edge.speed_limit", "edge.urban"], "action": "include"}})
              edges = t.get("edges", [])
              print("==", name, round(r["trip"]["summary"]["length"],1), "km; keys:", sorted(edges[0].keys()) if edges else t)
              by = {}
              for e in edges:
                  k = (e.get("density"), e.get("road_class"))
                  by[k] = by.get(k, 0) + e.get("length", 0)
              for k in sorted(by, key=lambda k: (k[0] if k[0] is not None else -1, str(k[1]))): print("  density", k[0], k[1], round(by[k], 1), "km")
              # a readable sample: every ~10th edge with name and density
              for e in edges[::max(1, len(edges)//25)]: print("   ", e.get("density"), e.get("road_class"), e.get("use"), e.get("urban"), (e.get("names") or [""])[0], round(e.get("length",0),2))
          PY
          python3 probe.py
