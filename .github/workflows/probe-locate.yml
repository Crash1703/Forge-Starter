name: Temporary probe of the route server's locate endpoint
on:
  push:
    branches: [claude/route-planning-google-maps-xxipbl]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Locate a point in a paddock near Beerwah and one on a road
        run: |
          for p in '-26.8600,152.9700' '-26.8045,153.1291'; do
            lat=${p%,*}; lon=${p#*,}
            echo "== $p"
            curl -sS -m 30 -X POST https://valhalla1.openstreetmap.de/locate \
              -H 'Content-Type: application/json' \
              -d "{\"locations\":[{\"lat\":$lat,\"lon\":$lon}],\"costing\":\"motorcycle\",\"verbose\":false}" | head -c 1500
            echo
          done
