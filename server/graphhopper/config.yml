# Ride Forge's own route server: GraphHopper 11 with Australia from OpenStreetMap.
# The app sends its ride style (fastest / scenic / twisty) and avoid options
# as a custom model with each request, on top of these base profiles, so
# nothing here needs changing when the app's options do.
graphhopper:
  datareader.file: australia-latest.osm.pbf
  graph.location: graph-cache

  # What the app asks about roads: curviness for twisty routes, road class and
  # built-up areas for RideScore, surface for dirt, speed limits for ride mode.
  graph.encoded_values: car_access, car_average_speed, road_access, road_class, road_environment, toll, surface, track_type, curvature, max_speed, urban_density, ferry_speed
  graph.urban_density.threads: 4

  profiles:
    - name: motorcycle
      turn_costs:
        vehicle_types: [motorcycle, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [motorcycle-base.json]
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car-base.json]
  custom_models.directory: custom_models

  # Landmarks keep flexible (per-request) routing quick; no CH, so every
  # request can carry its own ride style.
  profiles_ch: []
  profiles_lm:
    - profile: motorcycle
    - profile: car
  prepare.lm.landmarks: 16
  prepare.lm.threads: 2

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 2
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 5000000
  routing.max_visited_nodes: 3000000
  import.osm.ignored_highways: footway,construction,cycleway,path,steps,pedestrian,bridleway
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      # Only this computer: the phone reaches it through an https tunnel (docs/own-route-server.md).
      bind_host: localhost
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: file
      time_zone: UTC
      current_log_filename: logs/graphhopper.log
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      archive: true
      archived_log_filename_pattern: ./logs/graphhopper-%d.log.gz
      archived_file_count: 7
      never_block: true
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
